<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" shape-rendering="crispEdges" class="pixel-fox">
  <g class="ears">
    <rect x="40" y="20" width="10" height="10" fill="#ff6e1a"/>
    <rect x="50" y="20" width="10" height="10" fill="#ff6e1a"/>
    <rect x="40" y="30" width="20" height="10" fill="#ff6e1a"/>
    <rect x="50" y="30" width="10" height="10" fill="#fffaf0"/>
    <rect x="140" y="20" width="10" height="10" fill="#ff6e1a"/>
    <rect x="150" y="20" width="10" height="10" fill="#ff6e1a"/>
    <rect x="140" y="30" width="20" height="10" fill="#ff6e1a"/>
    <rect x="140" y="30" width="10" height="10" fill="#fffaf0"/>
  </g>
  <g class="head">
    <rect x="40" y="40" width="120" height="10" fill="#ff6e1a"/>
    <rect x="40" y="50" width="120" height="10" fill="#ff6e1a"/>
    <rect x="40" y="60" width="120" height="10" fill="#ff6e1a"/>
    <rect x="40" y="70" width="120" height="10" fill="#ff6e1a"/>
    <rect x="40" y="80" width="120" height="10" fill="#ff6e1a"/>
    <rect x="40" y="90" width="120" height="10" fill="#ff6e1a"/>
    <rect x="50" y="100" width="100" height="10" fill="#ff6e1a"/>
  </g>
  <g class="face-patch">
    <rect x="70" y="50" width="60" height="10" fill="#fffaf0"/>
    <rect x="80" y="60" width="40" height="10" fill="#fffaf0"/>
    <rect x="80" y="70" width="40" height="10" fill="#fffaf0"/>
    <rect x="80" y="80" width="40" height="10" fill="#fffaf0"/>
    <rect x="90" y="90" width="20" height="10" fill="#fffaf0"/>
  </g>
  <g class="eyes">
    <rect x="60" y="60" width="10" height="10" fill="#1a1a1a"/>
    <rect x="130" y="60" width="10" height="10" fill="#1a1a1a"/>
  </g>
  <g class="cheeks">
    <rect x="50" y="70" width="10" height="10" fill="#ffb6c1"/>
    <rect x="140" y="70" width="10" height="10" fill="#ffb6c1"/>
  </g>
  <g class="nose">
    <rect x="90" y="70" width="20" height="10" fill="#1a1a1a"/>
  </g>
  <g class="body">
    <rect x="60" y="110" width="80" height="10" fill="#ff6e1a"/>
    <rect x="60" y="120" width="80" height="10" fill="#ff6e1a"/>
    <rect x="60" y="130" width="80" height="10" fill="#ff6e1a"/>
    <rect x="60" y="140" width="80" height="10" fill="#ff6e1a"/>
    <rect x="70" y="150" width="60" height="10" fill="#ff6e1a"/>
    <rect x="80" y="120" width="40" height="10" fill="#fffaf0"/>
    <rect x="80" y="130" width="40" height="10" fill="#fffaf0"/>
    <rect x="80" y="140" width="40" height="10" fill="#fffaf0"/>
  </g>
  <g class="tail">
    <rect x="140" y="130" width="10" height="10" fill="#ff6e1a"/>
    <rect x="150" y="130" width="10" height="10" fill="#ff6e1a"/>
    <rect x="150" y="140" width="10" height="10" fill="#fffaf0"/>
  </g>
  <g class="feet">
    <rect x="60" y="160" width="20" height="10" fill="#ff6e1a"/>
    <rect x="120" y="160" width="20" height="10" fill="#ff6e1a"/>
  </g>
</svg>
