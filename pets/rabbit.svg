<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" shape-rendering="crispEdges" class="pixel-rabbit">
  <g class="ears">
    <rect x="50" y="20" width="20" height="10" fill="#fafafa"/>
    <rect x="50" y="30" width="20" height="10" fill="#fafafa"/>
    <rect x="50" y="40" width="20" height="10" fill="#fafafa"/>
    <rect x="50" y="50" width="20" height="10" fill="#fafafa"/>
    <rect x="50" y="60" width="20" height="10" fill="#fafafa"/>
    <rect x="60" y="30" width="10" height="30" fill="#ffc0cb"/>
    <rect x="130" y="20" width="20" height="10" fill="#fafafa"/>
    <rect x="130" y="30" width="20" height="10" fill="#fafafa"/>
    <rect x="130" y="40" width="20" height="10" fill="#fafafa"/>
    <rect x="130" y="50" width="20" height="10" fill="#fafafa"/>
    <rect x="130" y="60" width="20" height="10" fill="#fafafa"/>
    <rect x="130" y="30" width="10" height="30" fill="#ffc0cb"/>
  </g>
  <g class="head">
    <rect x="40" y="70" width="120" height="10" fill="#fafafa"/>
    <rect x="40" y="80" width="120" height="10" fill="#fafafa"/>
    <rect x="40" y="90" width="120" height="10" fill="#fafafa"/>
    <rect x="40" y="100" width="120" height="10" fill="#fafafa"/>
    <rect x="40" y="110" width="120" height="10" fill="#fafafa"/>
  </g>
  <g class="eyes">
    <rect x="60" y="90" width="10" height="10" fill="#1a1a1a"/>
    <rect x="130" y="90" width="10" height="10" fill="#1a1a1a"/>
  </g>
  <g class="cheeks">
    <rect x="50" y="100" width="10" height="10" fill="#ffc0cb"/>
    <rect x="140" y="100" width="10" height="10" fill="#ffc0cb"/>
  </g>
  <g class="nose">
    <rect x="90" y="100" width="20" height="10" fill="#1a1a1a"/>
  </g>
  <g class="mouth">
    <rect x="80" y="120" width="40" height="10" fill="#ffc0cb"/>
    <rect x="90" y="130" width="20" height="10" fill="#ffc0cb"/>
  </g>
  <g class="body">
    <rect x="50" y="130" width="100" height="10" fill="#fafafa"/>
    <rect x="50" y="140" width="100" height="10" fill="#fafafa"/>
    <rect x="50" y="150" width="100" height="10" fill="#fafafa"/>
    <rect x="60" y="160" width="80" height="10" fill="#fafafa"/>
    <rect x="50" y="160" width="10" height="10" fill="#fafafa"/>
    <rect x="140" y="160" width="10" height="10" fill="#fafafa"/>
  </g>
</svg>
