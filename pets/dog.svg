    <rect x="90" y="80" width="20" height="10" fill="#1a1a1a"/>
  </g>
  <g class="body">
    <rect x="60" y="110" width="80" height="10" fill="#a0522d"/>
    <rect x="60" y="120" width="80" height="10" fill="#a0522d"/>
    <rect x="60" y="130" width="80" height="10" fill="#a0522d"/>
    <rect x="60" y="140" width="80" height="10" fill="#a0522d"/>
    <rect x="80" y="130" width="40" height="10" fill="#f5d4a8"/>
