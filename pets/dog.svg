<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" shape-rendering="crispEdges" class="pixel-dog">
  <g class="ears">
    <rect x="30" y="30" width="20" height="10" fill="#6b3410"/>
    <rect x="30" y="40" width="20" height="10" fill="#6b3410"/>
    <rect x="30" y="50" width="20" height="10" fill="#6b3410"/>
    <rect x="30" y="60" width="20" height="10" fill="#6b3410"/>
    <rect x="150" y="30" width="20" height="10" fill="#6b3410"/>
    <rect x="150" y="40" width="20" height="10" fill="#6b3410"/>
    <rect x="150" y="50" width="20" height="10" fill="#6b3410"/>
    <rect x="150" y="60" width="20" height="10" fill="#6b3410"/>
  </g>
  <g class="head">
    <rect x="50" y="30" width="100" height="10" fill="#a0522d"/>
    <rect x="50" y="40" width="100" height="10" fill="#a0522d"/>
    <rect x="50" y="50" width="100" height="10" fill="#a0522d"/>
    <rect x="50" y="60" width="100" height="10" fill="#a0522d"/>
    <rect x="50" y="70" width="100" height="10" fill="#a0522d"/>
    <rect x="50" y="80" width="100" height="10" fill="#a0522d"/>
    <rect x="50" y="90" width="100" height="10" fill="#a0522d"/>
    <rect x="60" y="100" width="80" height="10" fill="#a0522d"/>
  </g>
  <g class="eyes">
