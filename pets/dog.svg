  </g>
  <g class="snout">
    <rect x="80" y="70" width="40" height="10" fill="#f5d4a8"/>
    <rect x="80" y="80" width="40" height="10" fill="#f5d4a8"/>
    <rect x="80" y="90" width="40" height="10" fill="#f5d4a8"/>
