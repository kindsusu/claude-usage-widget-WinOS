<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" shape-rendering="crispEdges" class="pixel-monster">
  <g class="horns">
    <rect x="50" y="30" width="10" height="10" fill="#ce93d8"/>
    <rect x="50" y="40" width="10" height="10" fill="#ce93d8"/>
    <rect x="140" y="30" width="10" height="10" fill="#ce93d8"/>
    <rect x="140" y="40" width="10" height="10" fill="#ce93d8"/>
  </g>
  <g class="head">
    <rect x="50" y="40" width="100" height="10" fill="#9c27b0"/>
    <rect x="40" y="50" width="120" height="10" fill="#9c27b0"/>
    <rect x="40" y="60" width="120" height="10" fill="#9c27b0"/>
    <rect x="40" y="70" width="120" height="10" fill="#9c27b0"/>
    <rect x="40" y="80" width="120" height="10" fill="#9c27b0"/>
    <rect x="40" y="90" width="120" height="10" fill="#9c27b0"/>
    <rect x="40" y="100" width="120" height="10" fill="#9c27b0"/>
    <rect x="40" y="110" width="120" height="10" fill="#9c27b0"/>
  </g>
  <g class="eye">
    <rect x="80" y="60" width="40" height="40" fill="#ffffff"/>
    <rect x="90" y="70" width="20" height="20" fill="#1a1a1a"/>
  </g>
  <g class="cheeks">
    <rect x="50" y="90" width="10" height="10" fill="#ffc0cb"/>
    <rect x="140" y="90" width="10" height="10" fill="#ffc0cb"/>
  </g>
  <g class="mouth">
    <rect x="60" y="100" width="80" height="10" fill="#1a1a1a"/>
    <rect x="60" y="110" width="80" height="10" fill="#1a1a1a"/>
    <rect x="70" y="100" width="10" height="20" fill="#ffffff"/>
    <rect x="90" y="100" width="10" height="20" fill="#ffffff"/>
    <rect x="110" y="100" width="10" height="20" fill="#ffffff"/>
  </g>
  <g class="body">
    <rect x="40" y="120" width="120" height="10" fill="#9c27b0"/>
    <rect x="40" y="130" width="120" height="10" fill="#9c27b0"/>
    <rect x="40" y="140" width="120" height="10" fill="#9c27b0"/>
    <rect x="50" y="150" width="100" height="10" fill="#9c27b0"/>
    <rect x="70" y="130" width="60" height="10" fill="#ce93d8"/>
    <rect x="70" y="140" width="60" height="10" fill="#ce93d8"/>
  </g>
  <g class="feet">
    <rect x="60" y="160" width="20" height="10" fill="#9c27b0"/>
    <rect x="120" y="160" width="20" height="10" fill="#9c27b0"/>
  </g>
</svg>
