<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" shape-rendering="crispEdges" class="pixel-bat">
  <g class="ears">
    <rect x="60" y="30" width="20" height="10" fill="#5e35b1"/>
    <rect x="60" y="40" width="20" height="10" fill="#5e35b1"/>
    <rect x="70" y="40" width="10" height="10" fill="#ec407a"/>
    <rect x="120" y="30" width="20" height="10" fill="#5e35b1"/>
    <rect x="120" y="40" width="20" height="10" fill="#5e35b1"/>
    <rect x="120" y="40" width="10" height="10" fill="#ec407a"/>
  </g>
  <g class="head">
    <rect x="60" y="50" width="80" height="10" fill="#5e35b1"/>
    <rect x="50" y="60" width="100" height="10" fill="#5e35b1"/>
    <rect x="50" y="70" width="100" height="10" fill="#5e35b1"/>
