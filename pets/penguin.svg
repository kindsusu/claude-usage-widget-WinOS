<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" shape-rendering="crispEdges" class="pixel-penguin">
  <g class="head">
    <rect x="60" y="30" width="80" height="10" fill="#1a1a1a"/>
    <rect x="50" y="40" width="100" height="10" fill="#1a1a1a"/>
    <rect x="50" y="50" width="100" height="10" fill="#1a1a1a"/>
    <rect x="50" y="60" width="100" height="10" fill="#1a1a1a"/>
    <rect x="50" y="70" width="100" height="10" fill="#1a1a1a"/>
    <rect x="50" y="80" width="100" height="10" fill="#1a1a1a"/>
  </g>
  <g class="face">
    <rect x="70" y="50" width="60" height="10" fill="#ffffff"/>
    <rect x="70" y="60" width="60" height="10" fill="#ffffff"/>
    <rect x="70" y="70" width="60" height="10" fill="#ffffff"/>
    <rect x="70" y="80" width="60" height="10" fill="#ffffff"/>
  </g>
  <g class="eyes">
    <rect x="80" y="60" width="10" height="10" fill="#1a1a1a"/>
    <rect x="110" y="60" width="10" height="10" fill="#1a1a1a"/>
  </g>
  <g class="beak">
    <rect x="90" y="70" width="20" height="10" fill="#ff9500"/>
    <rect x="90" y="80" width="20" height="10" fill="#ff9500"/>
  </g>
  <g class="body">
    <rect x="50" y="90" width="100" height="10" fill="#1a1a1a"/>
    <rect x="50" y="100" width="100" height="10" fill="#1a1a1a"/>
    <rect x="50" y="110" width="100" height="10" fill="#1a1a1a"/>
    <rect x="50" y="120" width="100" height="10" fill="#1a1a1a"/>
    <rect x="50" y="130" width="100" height="10" fill="#1a1a1a"/>
    <rect x="50" y="140" width="100" height="10" fill="#1a1a1a"/>
    <rect x="60" y="150" width="80" height="10" fill="#1a1a1a"/>
  </g>
  <g class="belly">
    <rect x="70" y="90" width="60" height="10" fill="#ffffff"/>
    <rect x="60" y="100" width="80" height="10" fill="#ffffff"/>
    <rect x="60" y="110" width="80" height="10" fill="#ffffff"/>
    <rect x="60" y="120" width="80" height="10" fill="#ffffff"/>
    <rect x="60" y="130" width="80" height="10" fill="#ffffff"/>
    <rect x="60" y="140" width="80" height="10" fill="#ffffff"/>
  </g>
  <g class="feet">
    <rect x="60" y="160" width="20" height="10" fill="#ff9500"/>
    <rect x="120" y="160" width="20" height="10" fill="#ff9500"/>
  </g>
</svg>
