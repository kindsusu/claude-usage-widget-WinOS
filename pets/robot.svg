<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" shape-rendering="crispEdges" class="pixel-robot">
  <g class="antenna">
    <rect x="100" y="20" width="10" height="10" fill="#81d4fa"/>
    <rect x="100" y="30" width="10" height="10" fill="#757575"/>
  </g>
  <g class="head">
    <rect x="50" y="40" width="100" height="10" fill="#bdbdbd"/>
    <rect x="50" y="50" width="100" height="10" fill="#bdbdbd"/>
    <rect x="50" y="60" width="100" height="10" fill="#bdbdbd"/>
    <rect x="50" y="70" width="100" height="10" fill="#bdbdbd"/>
    <rect x="50" y="80" width="100" height="10" fill="#bdbdbd"/>
    <rect x="50" y="90" width="100" height="10" fill="#bdbdbd"/>
  </g>
  <g class="eyes">
    <rect x="60" y="60" width="20" height="20" fill="#1a1a1a"/>
    <rect x="120" y="60" width="20" height="20" fill="#1a1a1a"/>
  </g>
  <g class="cheeks">
    <rect x="50" y="80" width="10" height="10" fill="#ffc0cb"/>
    <rect x="140" y="80" width="10" height="10" fill="#ffc0cb"/>
  </g>
  <g class="mouth">
    <rect x="80" y="80" width="40" height="10" fill="#1a1a1a"/>
    <rect x="80" y="90" width="40" height="10" fill="#1a1a1a"/>
    <rect x="90" y="80" width="20" height="10" fill="#bdbdbd"/>
  </g>
  <g class="body">
    <rect x="60" y="100" width="80" height="10" fill="#bdbdbd"/>
    <rect x="60" y="110" width="80" height="10" fill="#bdbdbd"/>
    <rect x="60" y="120" width="80" height="10" fill="#bdbdbd"/>
    <rect x="60" y="130" width="80" height="10" fill="#bdbdbd"/>
    <rect x="60" y="140" width="80" height="10" fill="#bdbdbd"/>
  </g>
  <g class="monitor">
    <rect x="80" y="110" width="30" height="10" fill="#81d4fa"/>
    <rect x="80" y="120" width="30" height="10" fill="#81d4fa"/>
    <rect x="120" y="120" width="10" height="10" fill="#81d4fa"/>
    <rect x="120" y="110" width="10" height="10" fill="#757575"/>
  </g>
  <g class="arms">
    <rect x="40" y="100" width="20" height="10" fill="#bdbdbd"/>
    <rect x="40" y="110" width="20" height="10" fill="#bdbdbd"/>
    <rect x="40" y="120" width="20" height="10" fill="#bdbdbd"/>
    <rect x="30" y="130" width="30" height="10" fill="#81d4fa"/>
    <rect x="140" y="100" width="20" height="10" fill="#bdbdbd"/>
    <rect x="140" y="110" width="20" height="10" fill="#bdbdbd"/>
    <rect x="140" y="120" width="20" height="10" fill="#bdbdbd"/>
    <rect x="140" y="130" width="30" height="10" fill="#81d4fa"/>
  </g>
  <g class="legs">
    <rect x="70" y="150" width="20" height="10" fill="#bdbdbd"/>
    <rect x="70" y="160" width="20" height="10" fill="#bdbdbd"/>
    <rect x="110" y="150" width="20" height="10" fill="#bdbdbd"/>
    <rect x="110" y="160" width="20" height="10" fill="#bdbdbd"/>
  </g>
</svg>
