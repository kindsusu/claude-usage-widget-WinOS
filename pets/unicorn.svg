<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" shape-rendering="crispEdges" class="pixel-unicorn">
  <g class="horn">
    <rect x="100" y="20" width="10" height="10" fill="#ffd54f"/>
    <rect x="100" y="30" width="10" height="10" fill="#ffd54f"/>
    <rect x="90" y="40" width="20" height="10" fill="#ffd54f"/>
  </g>
  <g class="ears">
    <rect x="40" y="40" width="20" height="10" fill="#fff5e1"/>
    <rect x="40" y="50" width="20" height="10" fill="#fff5e1"/>
    <rect x="140" y="40" width="20" height="10" fill="#fff5e1"/>
    <rect x="140" y="50" width="20" height="10" fill="#fff5e1"/>
  </g>
  <g class="mane">
    <rect x="60" y="40" width="20" height="10" fill="#ff9ec6"/>
    <rect x="50" y="50" width="30" height="10" fill="#ff9ec6"/>
    <rect x="80" y="40" width="20" height="10" fill="#c8a8ff"/>
    <rect x="80" y="50" width="30" height="10" fill="#c8a8ff"/>
    <rect x="110" y="50" width="30" height="10" fill="#ff9ec6"/>
    <rect x="50" y="60" width="20" height="10" fill="#c8a8ff"/>
    <rect x="120" y="60" width="20" height="10" fill="#c8a8ff"/>
  </g>
  <g class="head">
    <rect x="60" y="60" width="80" height="10" fill="#fff5e1"/>
    <rect x="50" y="70" width="100" height="10" fill="#fff5e1"/>
    <rect x="50" y="80" width="100" height="10" fill="#fff5e1"/>
    <rect x="50" y="90" width="100" height="10" fill="#fff5e1"/>
    <rect x="50" y="100" width="100" height="10" fill="#fff5e1"/>
    <rect x="50" y="110" width="100" height="10" fill="#fff5e1"/>
  </g>
  <g class="eyes">
    <rect x="70" y="80" width="10" height="10" fill="#1a1a1a"/>
    <rect x="120" y="80" width="10" height="10" fill="#1a1a1a"/>
  </g>
  <g class="cheeks">
    <rect x="60" y="90" width="10" height="10" fill="#ff9ec6"/>
    <rect x="130" y="90" width="10" height="10" fill="#ff9ec6"/>
  </g>
  <g class="nose">
    <rect x="90" y="90" width="20" height="10" fill="#1a1a1a"/>
  </g>
  <g class="body">
    <rect x="50" y="120" width="100" height="10" fill="#fff5e1"/>
    <rect x="50" y="130" width="100" height="10" fill="#fff5e1"/>
    <rect x="50" y="140" width="100" height="10" fill="#fff5e1"/>
    <rect x="50" y="150" width="100" height="10" fill="#fff5e1"/>
    <rect x="70" y="130" width="60" height="10" fill="#ff9ec6"/>
    <rect x="70" y="140" width="60" height="10" fill="#ff9ec6"/>
  </g>
  <g class="tail">
    <rect x="150" y="130" width="10" height="10" fill="#c8a8ff"/>
    <rect x="150" y="140" width="20" height="10" fill="#ff9ec6"/>
  </g>
  <g class="feet">
    <rect x="60" y="160" width="20" height="10" fill="#fff5e1"/>
    <rect x="120" y="160" width="20" height="10" fill="#fff5e1"/>
  </g>
</svg>
