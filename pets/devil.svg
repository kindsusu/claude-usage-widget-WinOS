<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" shape-rendering="crispEdges" class="pixel-devil">
  <g class="horns">
    <rect x="40" y="20" width="10" height="10" fill="#e53935"/>
    <rect x="50" y="30" width="10" height="10" fill="#e53935"/>
    <rect x="140" y="20" width="10" height="10" fill="#e53935"/>
    <rect x="130" y="30" width="10" height="10" fill="#e53935"/>
  </g>
  <g class="head">
    <rect x="50" y="40" width="100" height="10" fill="#e53935"/>
    <rect x="40" y="50" width="120" height="10" fill="#e53935"/>
    <rect x="40" y="60" width="120" height="10" fill="#e53935"/>
    <rect x="40" y="70" width="120" height="10" fill="#e53935"/>
    <rect x="40" y="80" width="120" height="10" fill="#e53935"/>
    <rect x="40" y="90" width="120" height="10" fill="#e53935"/>
    <rect x="50" y="100" width="100" height="10" fill="#e53935"/>
  </g>
  <g class="eyes">
    <rect x="60" y="60" width="10" height="10" fill="#1a1a1a"/>
    <rect x="130" y="60" width="10" height="10" fill="#1a1a1a"/>
  </g>
  <g class="cheeks">
    <rect x="50" y="80" width="10" height="10" fill="#ffc0cb"/>
    <rect x="140" y="80" width="10" height="10" fill="#ffc0cb"/>
  </g>
  <g class="nose">
    <rect x="90" y="70" width="20" height="10" fill="#1a1a1a"/>
  </g>
  <g class="mouth">
    <rect x="80" y="80" width="40" height="10" fill="#1a1a1a"/>
    <rect x="80" y="90" width="40" height="10" fill="#1a1a1a"/>
    <rect x="90" y="80" width="20" height="10" fill="#e53935"/>
  </g>
  <g class="body">
    <rect x="50" y="110" width="100" height="10" fill="#e53935"/>
    <rect x="50" y="120" width="100" height="10" fill="#e53935"/>
    <rect x="50" y="130" width="100" height="10" fill="#e53935"/>
    <rect x="50" y="140" width="100" height="10" fill="#e53935"/>
    <rect x="60" y="150" width="80" height="10" fill="#e53935"/>
    <rect x="70" y="120" width="60" height="10" fill="#ef9a9a"/>
    <rect x="70" y="130" width="60" height="10" fill="#ef9a9a"/>
  </g>
  <g class="tail">
    <rect x="150" y="130" width="10" height="10" fill="#e53935"/>
    <rect x="160" y="140" width="10" height="10" fill="#e53935"/>
    <rect x="160" y="150" width="20" height="10" fill="#e53935"/>
    <rect x="170" y="140" width="10" height="10" fill="#e53935"/>
  </g>
  <g class="feet">
    <rect x="60" y="160" width="20" height="10" fill="#e53935"/>
    <rect x="120" y="160" width="20" height="10" fill="#e53935"/>
  </g>
</svg>
