<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Pixel Pets Preview</title>
  <link rel="stylesheet" href="pets.css">
  <style>
    body { background: #f4f3ee; font-family: system-ui; padding: 20px; margin: 0; }
    h1 { color: #333; font-size: 20px; margin: 0 0 16px; }
    .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 20px; max-width: 900px; }
    .cell { text-align: center; background: #fff; padding: 12px 6px; border-radius: 8px; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
    .cell img { width: 100px; height: 100px; image-rendering: pixelated; display: block; margin: 0 auto; }
    .cell .name { margin-top: 6px; font-size: 13px; color: #333; }
  </style>
</head>
<body>
  <h1>Pixel Pets (21)</h1>
  <div class="grid">
    <div class="cell"><img src="cat.svg" alt="cat"><div class="name">cat</div></div>
    <div class="cell"><img src="dog.svg" alt="dog"><div class="name">dog</div></div>
    <div class="cell"><img src="fox.svg" alt="fox"><div class="name">fox</div></div>
    <div class="cell"><img src="bear.svg" alt="bear"><div class="name">bear</div></div>
    <div class="cell"><img src="rabbit.svg" alt="rabbit"><div class="name">rabbit</div></div>
    <div class="cell"><img src="penguin.svg" alt="penguin"><div class="name">penguin</div></div>
    <div class="cell"><img src="pig.svg" alt="pig"><div class="name">pig</div></div>
    <div class="cell"><img src="chick.svg" alt="chick"><div class="name">chick</div></div>
    <div class="cell"><img src="panda.svg" alt="panda"><div class="name">panda</div></div>
    <div class="cell"><img src="frog.svg" alt="frog"><div class="name">frog</div></div>
    <div class="cell"><img src="ghost.svg" alt="ghost"><div class="name">ghost</div></div>
    <div class="cell"><img src="unicorn.svg" alt="unicorn"><div class="name">unicorn</div></div>
    <div class="cell"><img src="dragon.svg" alt="dragon"><div class="name">dragon</div></div>
    <div class="cell"><img src="slime.svg" alt="slime"><div class="name">slime</div></div>
    <div class="cell"><img src="robot.svg" alt="robot"><div class="name">robot</div></div>
    <div class="cell"><img src="alien.svg" alt="alien"><div class="name">alien</div></div>
    <div class="cell"><img src="dino.svg" alt="dino"><div class="name">dino</div></div>
    <div class="cell"><img src="bat.svg" alt="bat"><div class="name">bat</div></div>
    <div class="cell"><img src="monster.svg" alt="monster"><div class="name">monster</div></div>
    <div class="cell"><img src="devil.svg" alt="devil"><div class="name">devil</div></div>
    <div class="cell"><img src="claudecode.svg" alt="claudecode"><div class="name">claudecode</div></div>
  </div>
</body>
</html>
