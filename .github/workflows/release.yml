# One workflow for CI and publishing, on purpose.
#
# The gate (pip install, py_compile, --selftest) runs on EVERY push to main,
# every pull request and every tag. Publishing steps — the tag/__version__
# check, the sha256, the GitHub Release — are the only ones conditioned on a
# tag. Because both paths execute the very same gate steps, the gate can never
# drift from what release day runs: a break shows up on the push that caused
# it instead of surfacing only once a tag is pushed.
#
# Publishing = pushing a tag. `git push` to main never reaches users; only a
# release created here does (the widget's auto-updater reads /releases/latest).
#
#   1. bump __version__ in widget.pyw, commit, push
#   2. git tag v1.2.3 && git push --tags
name: release

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    # widget.pyw is UTF-8 with Korean strings; the runner's Python defaults its
    # streams to cp1252, so any traceback or print through them would raise
    # UnicodeEncodeError. PYTHONIOENCODING pins the streams (it outranks UTF-8
    # mode), PYTHONUTF8 covers the rest of the encoding defaults.
    env:
      PYTHONIOENCODING: "utf-8"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gate - compile + selftest (same gate the updater uses)
        shell: bash
        run: |
          python -m pip install --quiet pillow pystray
          python -m py_compile widget.pyw
          python widget.pyw --selftest

      - name: Tag must match __version__
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver=$(python - <<'PY'
          import re, io
          src = io.open("widget.pyw", encoding="utf-8").read()
          print(re.search(r'^__version__\s*=\s*"([^"]+)"', src, re.M).group(1))
          PY
          )
          # Python on the Windows runner writes CRLF; strip the CR or the
          # trailing \r rides along and the comparison always fails.
          ver="$(printf '%s' "$ver" | tr -d '\r')"
          echo "tag=$tag  __version__=$ver"
          [ "$tag" = "$ver" ] || { echo "::error::tag v$tag does not match __version__ $ver"; exit 1; }

      - name: sha256
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          sha256sum widget.pyw | awk '{print $1 "  widget.pyw"}' > widget.pyw.sha256
          cat widget.pyw.sha256

      - name: Create GitHub Release with assets
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" widget.pyw widget.pyw.sha256 \
            --title "Claude Usage Widget $GITHUB_REF_NAME" \
            --generate-notes
